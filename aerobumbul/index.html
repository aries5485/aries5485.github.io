<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Defender 1945</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden; /* Mencegah scroll */
            touch-action: none; /* Mencegah zoom/scroll default pada mobile */
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #222;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            color: #fff;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
        }
        h1 { font-size: 40px; margin-bottom: 10px; color: #ffcc00; text-align: center; }
        p { font-size: 18px; text-align: center; margin: 5px; }
        .btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            background: #e74c3c;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        .btn:active { background: #c0392b; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- HUD / UI -->
    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-display">SCORE: 0</div>
            <div id="lives-display">LIVES: 3</div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h1>SKY DEFENDER</h1>
        <p>Tap & Drag untuk Menggerakkan Pesawat</p>
        <p>Hindari Tabrakan & Tembak Musuh</p>
        <button class="btn" id="start-btn">MULAI MISI</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p id="final-score">Score: 0</p>
        <button class="btn" id="restart-btn">MAIN LAGI</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- KONFIGURASI GAME ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Asset Images
        const imgPlayer = new Image(); imgPlayer.src = 'plane1.png';
        const imgEnemy = new Image(); imgEnemy.src = 'bomber.png';
        const imgBg = new Image(); imgBg.src = 'bg.png';

        // Variabel Game
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let animationId;
        
        // Ukuran Canvas Responsif
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- AUDIO SYSTEM (Synthesizer Sederhana) ---
        // Kita menggunakan Web Audio API agar tidak perlu file mp3 eksternal
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let bgmInterval;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        function startBGM() {
            if(bgmInterval) clearInterval(bgmInterval);
            // Musik loop sederhana (Bassline ritmis)
            let note = 0;
            bgmInterval = setInterval(() => {
                if(!gameRunning || !audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                // Pola nada: C2, C2, E2, G2
                const freqs = [65.41, 65.41, 82.41, 98.00]; 
                osc.frequency.value = freqs[note % 4];
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                note++;
            }, 250); // 120 BPM-ish
        }

        function stopBGM() {
            clearInterval(bgmInterval);
        }

        // --- GAME OBJECTS ---

        // 1. Background Scroller
        const background = {
            y: 0,
            speed: 2,
            draw: function() {
                // Gambar dua kali untuk looping mulus
                // Jika gambar gagal load, gunakan warna biru laut
                if (imgBg.complete && imgBg.naturalHeight !== 0) {
                    // Skala gambar agar fit width layar
                    const scale = canvas.width / imgBg.width;
                    const h = imgBg.height * scale;
                    
                    ctx.drawImage(imgBg, 0, this.y, canvas.width, h);
                    ctx.drawImage(imgBg, 0, this.y - h, canvas.width, h);

                    this.y += this.speed;
                    if (this.y >= h) {
                        this.y = 0;
                    }
                } else {
                    // Fallback
                    ctx.fillStyle = "#005580";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
        };

        // 2. Player
        const player = {
            x: 0,
            y: 0,
            width: 60,
            height: 60,
            speed: 0, 
            lastShot: 0,
            shootDelay: 15, // Frame delay
            active: true,
            
            init: function() {
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 150;
                this.active = true;
                this.lastShot = 0;
            },

            draw: function() {
                if (!this.active) return;
                if (imgPlayer.complete && imgPlayer.naturalHeight !== 0) {
                    ctx.drawImage(imgPlayer, this.x, this.y, this.width, this.height);
                } else {
                    // Fallback: Segitiga hijau
                    ctx.fillStyle = '#0f0';
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.width/2, this.y);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.lineTo(this.x, this.y + this.height);
                    ctx.fill();
                }
            },

            update: function() {
                if (!this.active) return;
                // Auto Fire
                if (frameCount - this.lastShot > this.shootDelay) {
                    this.shoot();
                    this.lastShot = frameCount;
                }
                
                // Batas Layar
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
                if (this.y < 0) this.y = 0;
                if (this.y > canvas.height - this.height) this.y = canvas.height - this.height;
            },

            shoot: function() {
                bullets.push(new Bullet(this.x + this.width / 2 - 5, this.y));
                playSound('shoot');
            },
            
            moveTo: function(targetX, targetY) {
                // Geser posisi pesawat agar jari ada di tengah pesawat (sedikit offset ke bawah agar terlihat)
                this.x = targetX - this.width / 2;
                this.y = targetY - this.height / 2 - 50; // Offset Y agar jari tidak menutupi pesawat
            }
        };

        // 3. Bullet Class
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 10;
                this.height = 20;
                this.speed = 10;
                this.markedForDeletion = false;
            }
            update() {
                this.y -= this.speed;
                if (this.y < 0) this.markedForDeletion = true;
            }
            draw() {
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        // 4. Enemy Class
        class Enemy {
            constructor() {
                this.width = 50;
                this.height = 50;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height; // Mulai dari atas layar
                this.speed = Math.random() * 3 + 2; // Kecepatan acak 2 - 5
                this.markedForDeletion = false;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.markedForDeletion = true;
            }
            draw() {
                if (imgEnemy.complete && imgEnemy.naturalHeight !== 0) {
                    ctx.drawImage(imgEnemy, this.x, this.y, this.width, this.height);
                } else {
                    // Fallback: Kotak Merah
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
        }

        // 5. Explosion Effect
        class Explosion {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 1;
                this.maxRadius = 30;
                this.speed = 2;
                this.markedForDeletion = false;
            }
            update() {
                this.radius += this.speed;
                if (this.radius > this.maxRadius) this.markedForDeletion = true;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 165, 0, ${1 - this.radius/this.maxRadius})`;
                ctx.fill();
            }
        }

        // Array containers
        let bullets = [];
        let enemies = [];
        let explosions = [];

        // --- INPUT HANDLING ---
        let isDragging = false;

        // Touch Events (Mobile)
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            const touch = e.touches[0];
            player.moveTo(touch.clientX, touch.clientY);
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging) {
                e.preventDefault(); // Mencegah scroll halaman saat main
                const touch = e.touches[0];
                player.moveTo(touch.clientX, touch.clientY);
            }
        }, {passive: false});

        canvas.addEventListener('touchend', () => { isDragging = false; });

        // Mouse Events (PC Testing)
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            player.moveTo(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                player.moveTo(e.clientX, e.clientY);
            }
        });
        canvas.addEventListener('mouseup', () => { isDragging = false; });


        // --- LOGIKA GAME LOOP ---

        function checkCollisions() {
            // Bullet vs Enemy
            bullets.forEach(bullet => {
                enemies.forEach(enemy => {
                    if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                        if (
                            bullet.x < enemy.x + enemy.width &&
                            bullet.x + bullet.width > enemy.x &&
                            bullet.y < enemy.y + enemy.height &&
                            bullet.y + bullet.height > enemy.y
                        ) {
                            // Hit!
                            enemy.markedForDeletion = true;
                            bullet.markedForDeletion = true;
                            score += 100;
                            document.getElementById('score-display').innerText = "SCORE: " + score;
                            playSound('explosion');
                            explosions.push(new Explosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2));
                        }
                    }
                });
            });

            // Player vs Enemy
            enemies.forEach(enemy => {
                if (!enemy.markedForDeletion && player.active) {
                     // Hitbox Player sedikit lebih kecil dari gambar agar adil
                    const padding = 10;
                    if (
                        player.x + padding < enemy.x + enemy.width &&
                        player.x + player.width - padding > enemy.x &&
                        player.y + padding < enemy.y + enemy.height &&
                        player.y + player.height - padding > enemy.y
                    ) {
                        enemy.markedForDeletion = true;
                        takeDamage();
                        explosions.push(new Explosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2));
                    }
                }
            });
        }

        function takeDamage() {
            lives--;
            playSound('hit');
            document.getElementById('lives-display').innerText = "LIVES: " + lives;
            
            // Efek layar merah sekilas
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = '0'; flash.style.left = '0';
            flash.style.width = '100%'; flash.style.height = '100%';
            flash.style.background = 'rgba(255,0,0,0.5)';
            document.body.appendChild(flash);
            setTimeout(() => document.body.removeChild(flash), 100);

            if (lives <= 0) {
                gameOver();
            }
        }

        function spawnEnemies() {
            // Spawn setiap 60 frame (sekitar 1 detik)
            // Semakin tinggi skor, semakin cepat spawnnya
            let spawnRate = 60;
            if (score > 1000) spawnRate = 45;
            if (score > 3000) spawnRate = 30;

            if (frameCount % spawnRate === 0) {
                enemies.push(new Enemy());
            }
        }

        function update() {
            if (!gameRunning) return;

            frameCount++;
            player.update();
            
            // Update Bullets
            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => !b.markedForDeletion);

            // Update Enemies
            spawnEnemies();
            enemies.forEach(e => e.update());
            enemies = enemies.filter(e => !e.markedForDeletion);

            // Update Explosions
            explosions.forEach(e => e.update());
            explosions = explosions.filter(e => !e.markedForDeletion);

            checkCollisions();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            background.draw();
            player.draw();
            bullets.forEach(b => b.draw());
            enemies.forEach(e => e.draw());
            explosions.forEach(e => e.draw());
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // --- GAME STATES ---

        function startGame() {
            initAudio(); // Penting: AudioContext butuh interaksi user
            startBGM();

            isDragging = false;
            score = 0;
            lives = 3;
            bullets = [];
            enemies = [];
            explosions = [];
            frameCount = 0;
            
            document.getElementById('score-display').innerText = "SCORE: 0";
            document.getElementById('lives-display').innerText = "LIVES: 3";
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            gameRunning = true;
            player.init();
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            stopBGM();
            cancelAnimationFrame(animationId);
            document.getElementById('final-score').innerText = "Final Score: " + score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // --- BUTTON LISTENERS ---
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

    </script>
</body>
</html>
